<main class="station-list">
  <header>
    <p>Bordeaux Mobility</p>
    <h1>Stations</h1>
  </header>

  <section aria-label="Recherche de stations">
    <label for="station-search">Rechercher une station</label>
    <input
      id="station-search"
      type="search"
      placeholder="Nom d'une station"
    />
  </section>

  <section aria-labelledby="stations-heading">
    <h2 id="stations-heading">Stations disponibles</h2>

    <p>Les stations seront affichées ici.</p>
  </section>
</main>
